name: kabadilink_mobile
description: "KabadiLink Collector Offline-First Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  http: ^1.2.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  tflite_flutter: ^0.10.4
  camera: ^0.10.5+9
  flutter_tts: ^3.8.5
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/models/stage1_detector.tflite
    - assets/models/stage2_classifier.tflite
